<!DOCTYPE html>
<html lang="zh-Hant">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>字數統計</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">

	<style type="text/css">
		* {
			font-family: 'Noto Sans TC', sans-serif;
		}

		[v-cloak] {
			display: none;
		}

		body {
			background: #f5f7fa;
		}

		.stat-card {
			background: #fff;
			border: 1px solid #e9ecef;
			border-radius: .5rem;
			padding: .75rem 1rem;
			text-align: center;
		}

		.stat-card .num {
			font-size: 1.5rem;
			font-weight: 700;
			line-height: 1.2;
		}

		.stat-card .lbl {
			font-size: .8rem;
			color: #6c757d;
		}

		#inputArea {
			width: 100%;
			border: 1px solid #ced4da;
			border-radius: .5rem;
			padding: .75rem;
			background: #fff;
			resize: vertical;
		}

		#inputArea:focus {
			outline: none;
			border-color: #80bdff;
			box-shadow: 0 0 0 .2rem rgba(13, 110, 253, .25);
		}

		.result-panel {
			background: #fff;
			border: 1px solid #e9ecef;
			border-radius: .5rem;
			overflow: hidden;
		}

		.result-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: .5rem;
			padding: .6rem 1rem;
			background: #343a40;
			color: #fff;
			font-size: .9rem;
		}

		.result-head .badge {
			font-weight: 500;
		}

		.result-head .btn {
			font-size: .8rem;
			padding: .2rem .7rem;
			white-space: nowrap;
		}

		.result-list {
			max-height: 460px;
			overflow-y: auto;
		}

		.result-list table {
			margin-bottom: 0;
		}

		.result-list thead th {
			position: sticky;
			top: 0;
			z-index: 1;
			background: #f1f3f5;
			color: #6c757d;
			font-size: .78rem;
			font-weight: 700;
			border-bottom: 2px solid #dee2e6;
			white-space: nowrap;
		}

		.result-list tbody td {
			vertical-align: middle;
			border-color: #f1f3f5;
		}

		.rank {
			width: 2rem;
			font-size: .75rem;
			color: #adb5bd;
			text-align: center;
		}

		.word-box {
			width: 2.4rem;
			height: 2.4rem;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #e9ecef;
			border-radius: .5rem;
			font-size: 1.2rem;
			font-weight: 700;
			color: #212529;
		}

		.count-cell {
			font-weight: 700;
			color: #1971c2;
		}

		.bar-wrap {
			display: flex;
			align-items: center;
			gap: .5rem;
			min-width: 90px;
		}

		.bar-track {
			flex: 1;
			height: .5rem;
			background: #f1f3f5;
			border-radius: .25rem;
			overflow: hidden;
		}

		.bar-fill {
			height: 100%;
			background: linear-gradient(90deg, #4dabf7, #1c7ed6);
			border-radius: .25rem;
			transition: width .25s ease;
		}

		.pct {
			width: 3.2rem;
			text-align: right;
			font-variant-numeric: tabular-nums;
		}

		.empty-tip {
			padding: 3rem 1rem;
			text-align: center;
			color: #adb5bd;
		}
	</style>
</head>

<body>
	<div id="app" v-cloak class="container-fluid py-4" style="max-width: 1100px;">
		<div class="text-center mb-4">
			<h4 class="fw-bold mb-1">字數統計</h4>
			<span class="text-muted small">只會列出出現「重複」的字，依出現次數由多至少排序</span>
		</div>

		<div class="row">
			<div class="col-12 col-lg-7 mb-3 mb-lg-0">
				<textarea id="inputArea" rows="16" v-model="inputData" @input="wordFrequency"
					placeholder="請在此貼上欲統計的內容…"></textarea>

				<div class="row g-2 mt-3">
					<div class="col-4">
						<div class="stat-card">
							<div class="num text-primary">{{ totalChars }}</div>
							<div class="lbl">總字數</div>
						</div>
					</div>
					<div class="col-4">
						<div class="stat-card">
							<div class="num text-success">{{ uniqueChars }}</div>
							<div class="lbl">不重複字數</div>
						</div>
					</div>
					<div class="col-4">
						<div class="stat-card">
							<div class="num text-danger">{{ results.length }}</div>
							<div class="lbl">重複字數</div>
						</div>
					</div>
				</div>
			</div>

			<div class="col-12 col-lg-5">
				<div class="result-panel">
					<div class="result-head">
						<span>統計結果 <span class="badge text-dark">{{ results.length }} 個重複字</span></span>
						<button type="button" class="btn btn-sm fw-bold"
							:class="copyState === 'ok' ? 'btn-success' : (copyState === 'fail' ? 'btn-warning' : 'btn-outline-light')"
							:disabled="!results.length" @click="copyResults">
							{{ copyLabel }}
						</button>
					</div>

					<div class="result-list" v-if="results.length">
						<table class="table table-hover align-middle">
							<thead>
								<tr>
									<th scope="col" class="rank">#</th>
									<th scope="col">字</th>
									<th scope="col" class="text-end">次數</th>
									<th scope="col">比例</th>
								</tr>
							</thead>
							<tbody>
								<tr v-for="(item, index) in results" :key="item.word">
									<td class="rank">{{ index + 1 }}</td>
									<td><div class="word-box">{{ item.word }}</div></td>
									<td class="text-end count-cell">{{ item.count }}</td>
									<td>
										<div class="bar-wrap">
											<div class="bar-track">
												<div class="bar-fill" :style="{ width: barWidth(item.count) }"></div>
											</div>
											<span class="small text-muted pct">{{ pct(item.count) }}</span>
										</div>
									</td>
								</tr>
							</tbody>
						</table>
					</div>

					<div class="empty-tip" v-else>
						尚未有重複的字<br />
						<small>輸入內容後即時顯示結果</small>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>

	<script type="text/javascript">
		const { createApp } = Vue;

		createApp({
			data() {
				return {
					inputData: "",
					results: [],
					totalChars: 0,
					uniqueChars: 0,
					copyState: "",
					copyTimer: null
				};
			},
			computed: {
				copyLabel() {
					if (this.copyState === "ok") return "已複製";
					if (this.copyState === "fail") return "複製失敗";
					return "複製結果";
				}
			},
			methods: {
				wordFrequency() {
					const pattern = /[\u4e00-\u9fa5]/g;
					const matchedWords = this.inputData.match(pattern) || [];

					const counts = {};
					matchedWords.forEach((word) => {
						counts[word] = (counts[word] || 0) + 1;
					});

					this.totalChars = matchedWords.length;
					this.uniqueChars = Object.keys(counts).length;

					this.results = Object.keys(counts)
						.filter((word) => counts[word] > 1)
						.map((word) => ({ word, count: counts[word] }))
						.sort((a, b) => b.count - a.count);
				},
				buildResultText() {
					const rows = [["名次", "字", "次數", "比例"]];
					this.results.forEach((item, index) => {
						rows.push([String(index + 1), item.word, String(item.count), this.pct(item.count)]);
					});
					return rows.map((row) => row.join("\t")).join("\r\n");
				},
				async copyResults() {
					if (!this.results.length) return;

					const text = this.buildResultText();
					let ok = false;

					try {
						if (navigator.clipboard && window.isSecureContext) {
							await navigator.clipboard.writeText(text);
							ok = true;
						}
					} catch (e) {
						ok = false;
					}

					if (!ok) {
						const ta = document.createElement("textarea");
						ta.value = text;
						ta.setAttribute("readonly", "");
						ta.style.position = "fixed";
						ta.style.top = "-1000px";
						document.body.appendChild(ta);
						ta.select();
						ta.setSelectionRange(0, text.length);
						try {
							ok = document.execCommand("copy");
						} catch (e) {
							ok = false;
						}
						document.body.removeChild(ta);
					}

					this.copyState = ok ? "ok" : "fail";
					clearTimeout(this.copyTimer);
					this.copyTimer = setTimeout(() => {
						this.copyState = "";
					}, 2000);
				},
				barWidth(count) {
					if (!this.results.length) return "0%";
					const max = this.results[0].count;
					return Math.max(4, Math.round(count / max * 100)) + "%";
				},
				pct(count) {
					if (!this.totalChars) return "0%";
					return (count / this.totalChars * 100).toFixed(1) + "%";
				}
			}
		}).mount('#app');
	</script>
</body>

</html>
